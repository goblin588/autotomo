[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autotomo"
version = "0.1.0"
description = "Automated polarisation tomography for photonic experiments"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "pyserial",
]

[project.scripts]
tomo-auto               = "autotomo.tomo_auto:main"
set-stages              = "autotomo.set_stage_angles:main"
characterise-waveplate  = "autotomo.characterise_waveplate:main"
home-stages             = "autotomo.home_stages:main"

[tool.setuptools.packages.find]
where   = ["src"]
exclude = ["figures*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
